version: "3.8"
services:
  rabbit:
    container_name: "rabbit"
    #image: rabbitmq:4-management
    image: rabbitmq:4
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - main

  db:
    # container_name: "db"
    image: postgres:16.6-bookworm
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
        - db.env
    ports:
      - "15432:5432"
    networks:
      - main

  redis:
    # container_name: "redis"
    image: "redis:alpine"
    expose:
      - 6379
    networks:
      - main

  bot:
    container_name: "bot"
    build:
      context: ./
      dockerfile: Dockerfile
        #ports:
        #  - "3002:3000"
    env_file:
        - bot.env
    links:
      - "redis"
      - "db"
      - "rabbit"
    networks:
      - main
    command: /bin/bash -c "npm run bot:start:prod"

  webapp:
    container_name: "webapp"
    build:
      context: ./
      dockerfile: Dockerfile
    #  args:
    #    - GH_REGISTRY_TOKEN
    # image: my/template-server:staging
    profiles: ["webapp"]
    ports:
      - 3000:3000
    links:
      - "redis"
      - "db"
      - "rabbit"
    env_file:
      - webapp.env
        # restart:
        #   unless-stopped
    command: /bin/bash -c "npm run webapp:start:prod"
    networks:
      - main
        #- traefik-hub
   # environment:
   #   - VIRTUAL_HOST=test.com

  #app-bubbles:
  #  container_name: "app-bubbles"
  #  build:
  #    context: ./
  #    dockerfile: apps/bubbles/Dockerfile
  #    args:
  #      - GH_REGISTRY_TOKEN
  #  # image: my/bubbles-server:staging
  #  profiles: ["bubbles"]
  #  ports:
  #    - 3000:3000
  #  links:
  #    - "redis"
  #    - "db"
  #  env_file:
  #    - apps/bubbles/docker.env
  #  restart:
  #    unless-stopped
  #  command: /bin/bash -c "npm run app:bubbles:prod"
  #  networks:
  #    - main
  # # environment:
  # #   - VIRTUAL_HOST=test.com

volumes:
  database:

networks:
  main:
    name: main
